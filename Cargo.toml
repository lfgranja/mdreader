[workspace]
members = ["crates/player", "crates/session", "crates/diag", "crates/engine-core", "crates/doc-structure", "crates/adapter-synthesis", "src-tauri"]
exclude = []
resolver = "3"

[workspace.dependencies]
proptest = "1.6.0"
tempfile = "3.14.0"
jsonschema = "0.29.0"
serde = { version = "1.0.215", features = ["derive"] }
serde_json = "1.0.132"
thiserror = "1.0.69"
tracing = "0.1.41"
clap = { version = "4.5.36", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "deny"
missing_debug_implementations = "deny"
unreachable_pub = "deny"
unused_results = "deny"

[workspace.lints.clippy]
all = "deny"
pedantic = "deny"
nursery = "warn"
cargo = "warn"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "deny"
unreachable = "deny"
todo = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
wildcard_dependencies = "deny"
multiple_crate_versions = "deny"
