<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0B0F1A; }
      .ring { stroke: #F2F0E6; stroke-width: 5; stroke-linecap: round; fill: none; }
      .w-blue { stroke: #8FD8E8; stroke-width: 4.5; stroke-linecap: round; fill: none; }
      .w-green { stroke: #5AD6A8; stroke-width: 4.5; stroke-linecap: round; fill: none; }
      .w-purple { stroke: #B9A6F5; stroke-width: 4.5; stroke-linecap: round; fill: none; }
      .core { fill: #F2F0E6; }
    </style>
  </defs>

  <!-- Fundo OLED Dark Sona -->
  <rect width="100" height="100" class="bg" rx="22"/>

  <!-- Anel de Contenção / Lente Semafórica com Fendas Polares -->
  <path d="M 50 18 A 32 32 0 0 1 82 50 M 82 50 A 32 32 0 0 1 50 82 A 32 32 0 0 1 18 50 A 32 32 0 0 1 50 18" class="ring"/>

  <!-- Tríade de Ondas Sonoras Harmônicas -->
  <!-- Onda 1: Azul Turquesa (Hymn of Valor / Foco / Frequência Superior) -->
  <path d="M 16 43 C 28 35, 38 48, 50 43 C 62 38, 72 51, 84 43" class="w-blue"/>

  <!-- Onda 2: Verde Jade (Aria of Perseverance / Cura / Frequência Central) -->
  <path d="M 14 50 C 26 50, 36 50, 50 50 C 64 50, 74 50, 86 50" class="w-green"/>

  <!-- Onda 3: Roxo Ametista (Song of Celerity / Ritmo / Frequência Inferior) -->
  <path d="M 16 57 C 28 65, 38 52, 50 57 C 62 62, 72 49, 84 57" class="w-purple"/>

  <!-- Nó Focal de Ressonância (Unison Core) -->
  <circle cx="50" cy="50" r="3.5" class="core"/>
</svg>
