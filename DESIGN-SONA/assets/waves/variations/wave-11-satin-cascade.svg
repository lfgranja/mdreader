<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 200" width="1200" height="200">
  <defs>
    <filter id="satin-shadow" x="-10%" y="-30%" width="120%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.04   0 0 0 0 0.06   0 0 0 0 0.10  0 0 0 0.5 0"/>
      <feOffset dx="0" dy="6"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="spec-glow-11" x="-10%" y="-30%" width="120%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Gradientes Multidirecionais de Cetim Pesado -->
    <!-- Segmento 1: Ciano/Turquesa Sedoso com Volume Transversal -->
    <linearGradient id="satin-seg1" x1="0%" y1="0%" x2="100%" y2="30%">
      <stop offset="0%" stop-color="#8FD8E8" stop-opacity="0.98"/>
      <stop offset="50%" stop-color="#6EE7B7" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#5AD6A8" stop-opacity="0.98"/>
    </linearGradient>

    <!-- Dobra 1: Sombra Interna & Reversão do Cetim -->
    <linearGradient id="satin-fold1" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1B4238" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#2D6B5A" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#5AD6A8" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Segmento 2: Menta/Jade Central em Cascata -->
    <linearGradient id="satin-seg2" x1="0%" y1="10%" x2="100%" y2="40%">
      <stop offset="0%" stop-color="#5AD6A8" stop-opacity="0.98"/>
      <stop offset="45%" stop-color="#46BD92" stop-opacity="0.96"/>
      <stop offset="75%" stop-color="#72BEE0" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#B9A6F5" stop-opacity="0.98"/>
    </linearGradient>

    <!-- Dobra 2: Reversão Lavanda em Cascata -->
    <linearGradient id="satin-fold2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#40326A" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#5D4B94" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#B9A6F5" stop-opacity="0.98"/>
    </linearGradient>

    <!-- Segmento 3: Lavanda Majestoso -->
    <linearGradient id="satin-seg3" x1="0%" y1="20%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B9A6F5" stop-opacity="0.98"/>
      <stop offset="50%" stop-color="#C4B5FD" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#A78BFA" stop-opacity="0.98"/>
    </linearGradient>

    <!-- Brilho Especular Cilíndrico de Tecido Cetim -->
    <linearGradient id="satin-specular" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="35%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="70%" stop-color="#E0F7FA" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="hotspot-left" cx="30%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#8FD8E8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#8FD8E8" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="hotspot-right" cx="70%" cy="35%" r="50%">
