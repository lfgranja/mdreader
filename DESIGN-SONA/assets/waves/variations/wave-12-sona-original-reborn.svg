<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 200" width="1200" height="200">
  <defs>
    <!-- Filtro de brilho sedoso suave -->
    <filter id="silk-glow-12" x="-10%" y="-30%" width="120%" height="160%">
      <feGaussianBlur stdDeviation="4.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    
    <filter id="soft-shadow-12" x="-5%" y="-20%" width="110%" height="150%">
      <feGaussianBlur stdDeviation="7" result="shadow"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.04   0 0 0 0 0.06   0 0 0 0 0.10  0 0 0 0.45 0"/>
      <feOffset dx="0" dy="5"/>
      <feComposite in="SourceGraphic" in2="shadow" operator="over"/>
    </filter>

    <!-- Gradiente Principal Sona Triad: Ciano -> Menta -> Lavanda -->
    <linearGradient id="reborn-grad-main" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8FD8E8" stop-opacity="0.95"/>
      <stop offset="18%" stop-color="#7BE0E2" stop-opacity="0.96"/>
      <stop offset="38%" stop-color="#5AD6A8" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#4ECCA3" stop-opacity="0.95"/>
      <stop offset="70%" stop-color="#7EBEE4" stop-opacity="0.92"/>
      <stop offset="86%" stop-color="#B9A6F5" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#C4B5FD" stop-opacity="0.96"/>
    </linearGradient>

    <!-- Gradiente de Profundidade / Sombra Interna do Cetim -->
    <linearGradient id="reborn-shade-left" x1="20%" y1="0%" x2="25%" y2="100%">
      <stop offset="0%" stop-color="#245561" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="#4C9CA9" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#19424D" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Gradiente da Dobra Inversa (Twist Under-fold) -->
    <linearGradient id="reborn-under-grad" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#1E4D40" stop-opacity="0.85"/>
      <stop offset="45%" stop-color="#286958" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#43366D" stop-opacity="0.85"/>
    </linearGradient>

    <!-- Gradiente Specular Esquerdo (Ciano/Menta) -->
    <linearGradient id="spec-left-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="30%" stop-color="#E2FBFC" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="90%" stop-color="#6EE7B7" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#5AD6A8" stop-opacity="0"/>
    </linearGradient>

    <!-- Gradiente Specular Direito (Lavanda) -->
    <linearGradient id="spec-right-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B9A6F5" stop-opacity="0"/>
      <stop offset="30%" stop-color="#EDE9FE" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="85%" stop-color="#DDD6FE" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#C4B5FD" stop-opacity="0"/>
    </linearGradient>

    <!-- Gradiente de Filamento Central -->
    <linearGradient id="filament-grad-12" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E0F7FA" stop-opacity="0.8"/>
      <stop offset="35%" stop-color="#A7F3D0" stop-opacity="0.9"/>
      <stop offset="65%" stop-color="#D1FAE5" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#EDE9FE" stop-opacity="0.85"/>
    </linearGradient>
  </defs>

