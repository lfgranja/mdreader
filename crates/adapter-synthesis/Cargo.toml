[package]
name = "adapter-synthesis"
version = "0.1.0"
edition = "2024"
description = "FR-024 synthesis adapter: offline_default tier (sherpa-onnx + Piper pt-BR), declared against the engine-core contract shapes."
license = "MIT"
repository = "https://github.com/mdreader/mdreader"
readme = "README.md"
keywords = ["tts", "synthesis", "adapter", "text-to-speech"]
categories = ["multimedia::audio", "text-processing"]

[dependencies]
clap = { workspace = true }
engine-core = { path = "../engine-core" }
sherpa-onnx = "=1.13.8"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk = "0.9"
ndk-context = "0.1"
ndk-sys = "0.6"

[lints]
workspace = true