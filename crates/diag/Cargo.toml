[package]
name = "diag"
license = "MIT"
version = "0.3.0"
edition = "2024"
description = "Diagnostic record: append-only JSONL logging with privacy-preserving field constraints."
repository = "https://github.com/mdreader/mdreader"
readme = "README.md"
keywords = ["diagnostics", "logging", "jsonl"]
categories = ["development-tools::debugging"]

[dependencies]
engine-core = { path = "../engine-core" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
clap = { workspace = true, features = ["derive"] }

[dev-dependencies]
proptest = { workspace = true }
tempfile = { workspace = true }
jsonschema = { workspace = true }

[lints]
workspace = true
