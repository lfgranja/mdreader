[package]
name = "player"
version = "0.1.0"
edition = "2024"

[dependencies]
cpal = "0.18.2"
adapter-synthesis = { path = "../adapter-synthesis" }
doc-structure = { path = "../doc-structure" }
engine-core = { path = "../engine-core" }
thiserror = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
clap = { workspace = true, features = ["derive"] }

# The NDK bindings are Android-only: `ndk-sys` emits a
# `compile_error!` on every non-Android target, so the
# dependency is gated to the Android build (Tauri Platform
# Contract — the Kotlin/NDK surface is the one language
# boundary the platform forces).
[target.'cfg(target_os = "android")'.dependencies]
ndk = "0.9"

[dev-dependencies]
proptest = { workspace = true }
tempfile = { workspace = true }
session = { path = "../session" }
diag = { path = "../diag" }

[[test]]
name = "test_focus_duck_pause_us2"
path = "tests/integration/test_focus_duck_pause_us2.rs"

[[test]]
name = "test_focus_intents_us2"
path = "tests/contract/test_focus_intents_us2.rs"

# US1/US3/US4/US5 targets (test_session_recovery_us1,
# test_external_start_us1, test_routing_us3,
# test_removal_signals_us3, test_lockscreen_us4,
# test_shell_ipc_us4, test_failover_us5) stay unwired until
# their test tasks (T019–T022b, T042–T044, T049–T055,
# T067–T071) land the files — wiring a missing path breaks
# every workspace build (this commit's first attempt proved it).

[lints]
workspace = true
