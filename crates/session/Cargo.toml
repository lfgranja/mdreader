[package]
name = "session"
license = "MIT"
version = "0.1.0"
edition = "2024"
description = "Session persistence: redb-backed bookmarks and settings with content-hash fingerprinting."
repository = "https://github.com/mdreader/mdreader"
readme = "README.md"
keywords = ["session", "bookmark", "persistence", "redb"]
categories = ["database"]

[dependencies]
redb = "2.6.0"
blake3 = "1.6.0"
doc-structure = { path = "../doc-structure" }
engine-core = { path = "../engine-core" }
thiserror = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
clap = { workspace = true, features = ["derive"] }

[dev-dependencies]
proptest = { workspace = true }
tempfile = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
