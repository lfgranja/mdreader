reason = "build-script-only dependency of sherpa-onnx-sys; vulnerable extraction path unreachable on supported targets (iOS-only branch); no zip>=9 upgrade possible at sherpa-onnx =1.13.8 (Exceptions Log entry 11, PROVISIONAL)"

[[advisories.ignore]]
