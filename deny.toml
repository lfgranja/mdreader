    { name = "tts-rs" },
    { name = "onnx" },
    { name = "sherpa" },
    { name = "candle" },
    { name = "burn" },
    { name = "tch" },
    { name = "llm" },
    { name = "llama-cpp-2" },
    { name = "llama-rs" },
    { name = "rust-bert" },
    { name = "openai" },
    { name = "async-openai" },
    { name = "openai-api" },
    { name = "langchain" },
    { name = "langchain-rust" },
    { name = "edge-tts-rs" },
