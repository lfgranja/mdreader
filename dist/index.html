<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Leitura</title>
  <style>
    :root {
      /* DESIGN-SONA palette tokens — contracts/surface.md
         "DESIGN-SONA palette tokens (single source of truth,
         resolves T044)": title #F2F0E6, section #A9B8CE,
         progress white / #55688F, warning #FFD400 banner-only,
         failure #FF4D63 banner-only; the green reserved by
         the contract is prohibited and appears nowhere on this
         surface. The
         Stop CONTROL carries the neutral progress tone #55688F
         (hover #55688F — the same neutral the secondary hover
         already uses), NOT the reserved failure red: a red Stop
         button paints a failure state the control never means
         (T104, contracts/surface.md "red #FF4D63 failure-only"). */
      --sona-void: #0B0F1A;
      --sona-stage: #141B2D;
      --sona-voice: #F2F0E6;
      --sona-etwahl: #8FD8E8;
      --sona-hush: #A9B8CE;
      --sona-harp: #E8C46A;
      --sona-boundary: #55688F;
      --sona-celeste: #B9A6F5;
      --sona-aria: #5AD6A8;
      --signal-caution: #FFD400;
      --signal-failure: #FF4D63;
      --radius: 16px;
      --btn-primary: var(--sona-hush); /* was --sona-etwahl; changed per Constitution S3 (token only in :focus-visible) */
      --btn-primary-hover: var(--sona-hush);
      --btn-secondary: #55688F;
      --btn-stop: #55688F;
      --btn-stop-hover: #55688F;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
    body {
      /* FR-015 / Principle IX (pure-offline): the surface names
         NO external font. A remote webfont is a network fetch at
         render time — an egress the crate-level guard cannot
         see. The stack is the platform UI face, so the surface
         renders identically with the radio off. */
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: var(--sona-void);
      color: var(--sona-voice);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: safe center;
      min-height: 100vh;
      margin: 0;
      padding: 1.5rem 1rem;
      width: 100%;
      overflow-x: hidden;
    }
    .card {
      background: rgba(20,27,45,0.65);
      backdrop-filter: blur(24px) saturate(120%);
      -webkit-backdrop-filter: blur(24px) saturate(120%);
      border: 1px solid rgba(143,216,232,0.3);
      /* Doppelrand borders */
      box-shadow: inset 0 0 0 1px rgba(143,216,232,0.15), 0 4px 24px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.05);
      border-radius: var(--radius);
      padding: 1rem 0.75rem 2.5rem;
      max-width: 460px;
      width: 100%;
      min-height: calc(100vh - 3rem);
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      text-align: center;
      box-sizing: border-box;
    }
    @supports not (backdrop-filter: blur(1px)) {
      .card { background: var(--sona-stage); }
    }
    .card::before {
      content: "";
      position: absolute;
      top: 22px;
      left: 0;
      right: 0;
      height: 84px;
      background-image: url("DESIGN-SONA/assets/waves/waves-top-ribbons.png");
      background-repeat: no-repeat;
      background-size: 100% auto;
      background-position: center center;
      opacity: 0.90;
      pointer-events: none;
      z-index: 0;
    }
    .wave-subtle {
      position: absolute;
      top: 6px;
      left: 12px;
      right: 12px;
      height: 24px;
      background-image: url("DESIGN-SONA/assets/waves/waves-top-ribbons.png");
      background-repeat: no-repeat;
      background-size: contain;
      background-position: center top;
      opacity: 0.35;
      pointer-events: none;
      z-index: 0;
    }
    #waveform {
      width: 100%;
      height: 300px;
      display: block;
      margin: 1.5rem 0;
      background: transparent;
      border: none;
      box-shadow: none;
    }
    #headerMark {
      margin: 1.0rem auto 1.6rem;
      position: relative;
      z-index: 2;
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
      outline: none !important;
      filter: none !important;
      -webkit-filter: none !important;
    }
    .rate-value {
      color: var(--sona-harp);
      font-weight: 600;
      font-size: 1rem;
      font-variant-numeric: tabular-nums;
      padding: 0.25rem 0.5rem;
      background: rgba(232,196,106,0.12);
      border: 1px solid rgba(232,196,106,0.25);
      border-radius: 6px;
    }
    .meta-box {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.14) 0%, rgba(255, 255, 255, 0.02) 40%, rgba(18, 25, 42, 0.82) 100%);
      backdrop-filter: blur(40px) saturate(140%);
      -webkit-backdrop-filter: blur(40px) saturate(140%);
      border: 1px solid rgba(255, 255, 255, 0.22);
      box-shadow: inset 0 2px 1px rgba(255, 255, 255, 0.40), inset 0 -1.5px 2px rgba(0, 0, 0, 0.5), 0 28px 60px rgba(0, 0, 0, 0.70);
      border-radius: 30px;
      padding: 2.2rem 2.4rem;
      width: 100%;
      max-width: 450px;
      margin: 1.2rem auto 0;
      text-align: center;
      position: relative;
      overflow: hidden;
      cursor: pointer;
      min-height: 48px;
      transition: transform 0.1s ease, border-color 0.15s ease, box-shadow 0.15s ease;
      outline: none;
    }
    .meta-box:active {
      transform: scale(0.985);
    }
    .meta-box:focus-visible {
      outline: 2px solid var(--sona-etwahl);
      outline-offset: 4px;
    }
    .meta-box::after {
      content: "";
      position: absolute;
      top: -60%;
      left: -60%;
      width: 220%;
      height: 220%;
      background: radial-gradient(circle at 28% 18%, rgba(255, 255, 255, 0.20) 0%, transparent 45%);
      pointer-events: none;
    }
    h1 {
      font-weight: 700;
      font-size: 3.25rem;
      letter-spacing: -0.035em;
      margin: 0 0 .6rem;
      color: #FFFFFF;
      line-height: 1.15;
      text-shadow: 0 2px 20px rgba(0,0,0,0.6);
    }
    .subtitle {
      color: rgba(242,240,230,0.90);
      font-size: 1.60rem;
      font-weight: 400;
      margin-bottom: 0;
      letter-spacing: -0.015em;
    }
    .section-title {
      font-weight: 300;
      color: var(--section);
      font-size: .95rem;
      margin-top: .5rem;
      min-height: 1.4em;
    }
    .bottom-island {
      background: rgba(26, 35, 54, 0.78);
      backdrop-filter: blur(36px);
      -webkit-backdrop-filter: blur(36px);
      border: 1px solid rgba(255,255,255,0.18);
      box-shadow: inset 0 1px 1px rgba(255,255,255,0.22), 0 24px 50px rgba(0,0,0,0.65);
      border-radius: 999px;
      padding: 0.65rem 1.1rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.85rem;
      margin: 1rem auto 1.5rem;
      width: auto;
      max-width: 96%;
    }
    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.65rem;
      margin: 0;
      width: auto;
    }
    button {
      font-family: inherit;
      font-weight: 500;
      border: none;
      border-radius: 50%;
      cursor: pointer;
      transition: transform .08s ease, opacity .15s, background .15s, box-shadow .15s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      height: 48px;
      padding: 0;
    }
    button:active { transform: scale(0.92); }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    button.primary {
      background: #FFFFFF;
      color: var(--sona-void);
      width: 64px;
      height: 64px;
      font-size: 1.6rem;
      box-shadow: 0 0 28px rgba(255,255,255,0.65), 0 4px 12px rgba(0,0,0,0.3);
    }
    button.primary:hover:not(:disabled) { background: #FFFFFF; }
    button.secondary {
      background: rgba(255,255,255,0.09);
      color: var(--sona-voice);
      border: 1px solid rgba(255,255,255,0.14);
      font-size: 1.25rem;
    }
    button.secondary:hover:not(:disabled) { background: rgba(255,255,255,0.16); }
    button.stop {
      opacity: 0;
      pointer-events: none;
      width: 0;
      height: 0;
      padding: 0;
      margin: 0;
      border: none;
    }
    button:focus-visible {
      outline: 2px solid var(--sona-etwahl);
      outline-offset: 2px;
    }
    .speed-control {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 0;
      background: transparent;
      border-radius: 0;
    }
    .speed-btn {
      opacity: 0;
      pointer-events: none;
      width: 0;
      height: 0;
      padding: 0;
      margin: 0;
      border: none;
    }
    .speed-dots {
      opacity: 0;
      pointer-events: none;
      width: 0;
      height: 0;
      padding: 0;
      margin: 0;
      border: none;
    }
    .speed-pill {
      cursor: pointer;
      user-select: none;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 44px;
      padding: 0 0.85rem;
      border-radius: 999px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.10);
      transition: background 0.15s;
    }
    .speed-pill:hover {
      background: rgba(255,255,255,0.15);
    }
    .rate-value {
      color: var(--sona-voice);
      font-weight: 500;
      font-size: 0.95rem;
      font-variant-numeric: tabular-nums;
      padding: 0;
      background: transparent;
      border: none;
      border-radius: 0;
    }
    #progress {
      width: 100%;
      height: 6px;
      background: var(--progress-bg);
      border-radius: 3px;
      margin-top: 1rem;
      overflow: hidden;
    }
    #progress-fill {
      height: 100%;
      width: 0%;
      background: var(--sona-voice);
      border-radius: 3px;
      transition: width .3s ease;
    }
    #progressLabel {
      min-height: 1.3rem;
      margin-top: .45rem;
      color: var(--section);
      font-size: .8rem;
      text-align: right;
    }
    .reason-banner {
      margin-top: 1rem;
      padding: .75rem 1rem;
      border-radius: 10px;
      font-size: .85rem;
      font-weight: 500;
      display: block;
      height: 0;
      overflow: hidden;
      padding-top: 0;
      padding-bottom: 0;
      margin-top: 0;
      border-width: 0;
      animation: none;
    }
    .reason-banner.visible { height: auto; overflow: visible; padding: .75rem 1rem; margin-top: 1rem; border-width: 1px; animation: slideIn .2s ease; }
    .reason-banner.warning { background: transparent; border: 1px solid var(--signal-caution); color: var(--signal-caution); }
    .reason-banner.failure { background: transparent; border: 1px solid var(--signal-failure); color: var(--signal-failure); animation: none; }
    /* FR-009: the resume offer — the visual dialog of the in-app
       route. The DESIGN-SONA tokens are the ones the card paints
       (title #F2F0E6, section #A9B8CE, the neutral progress tone
       #55688F) — no new token, no reserved green, no red (the
       reserved failure red paints a failure state this dialog
       never means). */
    dialog#offerDialog {
      width: min(420px, calc(100vw - 2rem));
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: var(--radius);
      background: linear-gradient(180deg, #141B2D 0%, #0B0F1A 100%);
      color: var(--title);
      padding: 2rem;
      box-shadow: 0 20px 60px rgba(0,0,0,0.6);
    }
    dialog#offerDialog::backdrop { background: rgba(0,0,0,0.65); }
    dialog#offerDialog h2 {
      font-weight: 700;
      font-size: 1.15rem;
      letter-spacing: -0.02em;
      margin: 0 0 .35rem;
      color: var(--title);
    }
    #offerQuestion {
      color: var(--section);
      font-size: .9rem;
      margin: 0 0 1rem;
    }
    #offerContext {
      border-top: 1px solid rgba(255,255,255,0.08);
      padding-top: .9rem;
      margin-bottom: 1.25rem;
    }
    #offerTitle { font-size: 1.1rem; font-weight: 600; }
    #offerSection { color: var(--section); font-size: .85rem; margin-top: .25rem; min-height: 1.2em; }
    #offerProgress { color: var(--section); font-size: .8rem; margin-top: .25rem; min-height: 1.2em; }
    .offer-actions {
      display: grid;
      grid-template-columns: 1fr;
      gap: .6rem;
    }
    @keyframes slideIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }
    .version-footer {
      font-size: .7rem;
      color: #A9B8CE;
      margin-top: 1rem;
      text-align: center;
    }
<!-- SCAFFOLD (template: status-surface.md S3-S5 + existing status_view.html; NOT production): token/aria/movement -->
<meta name="design-sona-scaffold" content="status-view-restyle-v2.2.0">
<style id="sona-scaffold-tokens">:root{--sona-void:#0B0F1A;--sona-stage:#141B2D;--sona-etwahl:#8FD8E8;--signal-caution:#FFD400;--signal-failure:#FF4D63;--sona-voice:#F2F0E6;--sona-hush:#A9B8CE;--sona-harp:#E8C46A;--sona-celeste:#B9A6F5;--sona-aria:#5AD6A8;--sona-boundary:#55688F;}@media(prefers-reduced-motion:reduce){#progress-fill{animation:none !important;transform:none !important;opacity:1 !important;animation-play-state: paused !important;} .reason-banner.warning{animation:none !important;animation-play-state: paused !important;} .card::before{animation:none !important;transform:none !important;animation-play-state: paused !important;}#waveform{animation:none !important;animation-play-state: paused !important;}}</style>
  <div aria-hidden="true" id="scaffold-inventory" data-elements="10"></div>
</head>
<div class="card" role="region" aria-label="Lente Sinestésica">
  <img id="headerMark" src="DESIGN-SONA/assets/logo/logo-proposta-3-concha.png" alt="" width="58" height="68" style="display:block; object-fit: contain; background: transparent;">
  
  <div class="meta-box" id="titleCard" role="button" tabindex="0" aria-label="Selecionar documento para leitura">
    <h1 id="documentTitle"></h1>
    <div class="subtitle" id="sectionTitle"><span aria-hidden="true">—</span><span class="sr-only">Sem título</span></div>
  </div>

  <canvas id="waveform" aria-hidden="true" width="388" height="320"></canvas>
  
  <div class="bottom-island">
    <div class="controls" id="transportControls">
      <button class="secondary" id="btnRepeat" aria-label="Repetir seção">↻</button>
      <button class="secondary" id="btnSkipBack" aria-label="Retroceder">⏮</button>
      <button class="primary" id="btnPlayPause" aria-label="Reproduzir/Pausar">▶</button>
      <button class="stop" id="btnStop" aria-label="Parar e limpar posição">⏹</button>
      <button class="secondary" id="btnSkipForward" aria-label="Avançar">⏭</button>
    </div>

    <div class="speed-control">
      <button class="secondary speed-btn" id="btnRateDown" aria-label="Diminuir velocidade">−</button>
      <div class="speed-dots" id="speedDots" aria-hidden="true"></div>
      <div class="speed-pill" id="speedPill" role="button" tabindex="0" aria-label="Ajustar velocidade">
        <span class="rate-value" id="rateValue" aria-hidden="true">1.25×</span>
      </div>
      <button class="secondary speed-btn" id="btnRateUp" aria-label="Aumentar velocidade">+</button>
    </div>
  </div>

  <div id="progress" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100" aria-valuetext="velocidade 1,0"><div id="progressFill"></div></div>
  <div class="sr-only" role="status" aria-live="polite" id="liveRegion"></div>
  <div id="progressLabel"></div>
  <div class="reason-banner" id="reasonBanner" role="status"></div>

  <div class="version-footer" id="versionFooter"></div>
</div>

<!-- FR-009: the resume offer — the deliberate-pause reopen. The
     dialog is HIDDEN until the shell publishes the in-app route:
     the shell owns the route, the window and the silence rule,
     and the surface renders what the shell publishes and
     dispatches the choice of the reader (contracts/surface.md
     "Resume:"). The lock-screen route opens NO in-app dialog. -->
<dialog id="offerDialog" aria-modal="true" aria-labelledby="offerHeading">
  <h2 id="offerHeading">Retomar a leitura</h2>
  <p id="offerQuestion">Continuar de onde parou ou começar do início?</p>
  <div id="offerContext">
    <div id="offerTitle"></div>
    <div id="offerSection"></div>
    <div id="offerProgress"></div>
  </div>
  <div class="offer-actions">
    <button class="primary" id="btnOfferContinue">Continuar de onde parei</button>
    <button class="secondary" id="btnOfferStartOver">Começar do início</button>
  </div>
</dialog>
<script type="module">
  // The frontend receives MirrorState updates via Tauri IPC channel
  // and renders read-only mirror of SurfaceSnapshot from Rust

  const state = {
    title: '',
    sectionTitle: null,
    transport: 'stopped',
    positionSecs: 0,
    progress: { kind: 'indeterminate' },
    progressLabel: null,
    rate: 1.0,
    reason: null,
    reasonExpiry: null,
    durationKnownAtStart: false,
  };

  const LADDER = [0.75, 1.0, 1.25, 1.5, 1.75, 2.0, 4.0];
  let rateIndex = 1; // default rung
  let fingerprint = null; // blake3 content fingerprint for Stop to clear bookmark

  // FR-009: the resume offer — the deliberate-pause reopen opens
  // the continue-vs-start-over dialog of the shell. The shell owns
  // the decision, the route and the window (the surface never
  // invents a bound and never decides the offer); the surface
  // renders what the shell publishes and dispatches the choice of
  // the reader.
  const offer = {
    route: null,
    windowMs: null,
    timer: null,
    shown: false,
  };

  // The offer poll period, in milliseconds: the cadence of the
  // surface for reading the route published by the shell — the
  // same 250 ms the shell polls its own offer window on.
  const OFFER_POLL_MS = 250;
  let offerPollBusy = false;

  // DOM elements
  const els = {
    documentTitle: document.querySelector('h1'),
    sectionTitle: document.getElementById('sectionTitle'),
    btnPlayPause: document.getElementById('btnPlayPause'),
    btnStop: document.getElementById('btnStop'),
    btnSkipBack: document.getElementById('btnSkipBack'),
    btnSkipForward: document.getElementById('btnSkipForward'),
    btnRepeat: document.getElementById('btnRepeat'),
    btnRateDown: document.getElementById('btnRateDown'),
    btnRateUp: document.getElementById('btnRateUp'),
    speedDots: document.getElementById('speedDots'),
    waveform: document.getElementById('waveform'),
    rateValue: document.getElementById('rateValue'),
    progress: document.getElementById('progress'),
    progressFill: document.getElementById('progressFill'),
    progressLabel: document.getElementById('progressLabel'),
    reasonBanner: document.getElementById('reasonBanner'),
    offerDialog: document.getElementById('offerDialog'),
    offerTitle: document.getElementById('offerTitle'),
    offerSection: document.getElementById('offerSection'),
    offerProgress: document.getElementById('offerProgress'),
    btnOfferContinue: document.getElementById('btnOfferContinue'),
    btnOfferStartOver: document.getElementById('btnOfferStartOver'),
    titleCard: document.getElementById('titleCard'),
  };

  // Transport icons
  const transportIcons = {
    playing: '⏸',
    paused: '▶',
    stopped: '▶',
    completed: '▶',
    interrupted: '▶',
  };

  // Transport labels
  const transportLabels = {
    playing: 'Pausar',
    paused: 'Reproduzir',
    stopped: 'Reproduzir',
    completed: 'Reproduzir',
    interrupted: 'Reproduzir',
  };

  // Render functions
  function renderTransport() {
    const icon = transportIcons[state.transport] || '▶';
    const label = transportLabels[state.transport] || 'Reproduzir';
    els.btnPlayPause.textContent = icon;
    els.btnPlayPause.setAttribute('aria-label', label);
    const isPlaying = state.transport === 'playing';
    els.btnPlayPause.classList.toggle('primary', isPlaying);
    els.btnPlayPause.classList.toggle('secondary', !isPlaying);
    // Disable transport controls only when completed or no document context is present
    const disabled = state.transport === 'completed';
    els.btnPlayPause.disabled = disabled;
    els.btnSkipBack.disabled = disabled;
    els.btnRepeat.disabled = disabled;
    els.btnSkipForward.disabled = disabled;
    els.btnRateDown.disabled = disabled;
    els.btnRateUp.disabled = disabled;
  }

  function renderSectionTitle() {
    const visibleSpan = els.sectionTitle.querySelector('span:not(.sr-only)');
    const srSpan = els.sectionTitle.querySelector('.sr-only');
    if (state.sectionTitle) {
      if (visibleSpan) visibleSpan.textContent = `Seção: ${state.sectionTitle}`;
      if (srSpan) srSpan.textContent = `Seção: ${state.sectionTitle}`;
    } else {
      if (visibleSpan) visibleSpan.textContent = '—';
      if (srSpan) srSpan.textContent = 'Sem título';
    }
  }

  function renderDocumentTitle() {
    // FR-011: title is document metadata (or the filename
    // placeholder) — never the first sentence, never prose.
    // Empty when no document is loaded: no internal build
    // name ever reaches a user-visible surface (naming
    // boundary, T047).
    els.documentTitle.textContent = state.title || '';
    const card = document.querySelector('.card');
    if (card) card.setAttribute('aria-label', state.title || 'Lente Sinestésica');
  }
  // RMS-driven waveform state
  const rmsBuffer = [];
  const RMS_BUFFER_SIZE = 64;
  let lastRms = 0;
  let waveformRafId = null;
  let lastWaveformFrame = 0;
  const WAVEFORM_FPS = 30;
  const WAVEFORM_FRAME_INTERVAL = 1000 / WAVEFORM_FPS;
  let waveformVisible = true;

  function pushRms(val) {
    const v = typeof val === 'number' && isFinite(val) ? Math.max(0, Math.min(1, val)) : 0;
    lastRms = v;
    rmsBuffer.push(v);
    if (rmsBuffer.length > RMS_BUFFER_SIZE) {
      rmsBuffer.shift();
    }
  }

  function drawWaveform(progressPct, indeterminate) {
    const canvas = els.waveform;
    if (!canvas) {
      // Fallback if canvas not available
      return;
    }
    const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduced) {
      if (canvas._frozenSnapshotDrawn) {
        // Keep static snapshot under reduced motion
        return;
      }
    }
    if (document.hidden || !waveformVisible) {
      return;
    }
    const ctx = canvas.getContext('2d');
    if (!ctx) {
      // Fallback if canvas context not available
      return;
    }
    // DPR cap at 2x
    const dpr = Math.min((window.devicePixelRatio && window.devicePixelRatio > 0) ? window.devicePixelRatio : 1, 2);
    const cssW = canvas.clientWidth || 388;
    const cssH = canvas.clientHeight || 240;
    const bw = Math.round(cssW * dpr);
    const bh = Math.round(cssH * dpr);
    if (canvas.width !== bw || canvas.height !== bh) {
      canvas.width = bw;
      canvas.height = bh;
    }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, cssW, cssH);
    ctx.beginPath();
    ctx.rect(0, 0, cssW, cssH);
    ctx.clip();
    const centerY = cssH / 2;
    // 5 pure silk ribbons matching canonical proposal 2
    // With ultra-soft spline curves, translucent gradients, and additive sheen
    const layerOpacities = [0.18, 0.22, 0.26, 0.30, 0.34];
    const fillGradients = [
      'rgba(143,216,232,' + layerOpacities[0] + ')',
      'rgba(90,214,168,' + layerOpacities[1] + ')',
      'rgba(110,210,210,' + layerOpacities[2] + ')',
      'rgba(185,166,245,' + layerOpacities[3] + ')',
      'rgba(185,166,245,' + layerOpacities[4] + ')'
    ];
    const strokeColors = [
      'rgba(143,216,232,0.85)',
      'rgba(90,214,168,0.90)',
      'rgba(110,210,210,0.80)',
      'rgba(185,166,245,0.90)',
      'rgba(200,185,250,0.95)'
    ];
    const ks = [0.85, 1.15, 0.72, 1.05, 0.92];
    const baseAmp = cssH * 0.44;
    const rmsMod = 0.52 + lastRms * 0.55;
    const amp = baseAmp * rmsMod;
    const nowMs = (performance.now ? performance.now() : Date.now());
    const t = nowMs * 0.00128; // 20% slower silk drift speed

    ctx.save();
    ctx.globalCompositeOperation = 'screen';

    // Dense curve points with Catmull-Rom or cubic Bezier spline for liquid silk appearance
    const numPoints = 28;
    const segW = cssW / (numPoints - 1);

    // 5 pure silk flowing bands with dynamic thickness, satin sheen and glowing edges
    for (let li = 0; li < 5; li++) {
      const k = ks[li];
      const phase = li * 1.35 + t * (0.70 + li * 0.14);
      const freq = 1.9 + li * 0.38;
      
      const ptsTop = [];
      const ptsBot = [];

      for (let j = 0; j < numPoints; j++) {
        const x = j * segW;
        const normX = x / cssW;
        // Gaussian bell envelope
        const bell = Math.exp(-Math.pow((normX - 0.5) * 3.1, 2));
        // Sinusoidal wave spine
        const wave = Math.sin(normX * Math.PI * freq + phase);
        const wave2 = Math.sin(normX * Math.PI * (freq * 1.5) - phase * 0.8) * 0.3;
        const spine = (wave + wave2) * amp * k * bell;
        
        // Ribbon thickness varies smoothly like a twisting silk ribbon
        const ribbonWidth = (16 + 32 * Math.sin(normX * Math.PI * 1.2 + li * 0.8)) * bell * (0.65 + 0.35 * lastRms);
        
        ptsTop.push({ x: x, y: centerY + spine - ribbonWidth * 0.5 });
        ptsBot.push({ x: x, y: centerY + spine + ribbonWidth * 0.5 });
      }

      // Draw flowing silk ribbon band
      ctx.beginPath();
      ctx.moveTo(ptsTop[0].x, ptsTop[0].y);
      for (let j = 0; j < ptsTop.length - 1; j++) {
        const xc = (ptsTop[j].x + ptsTop[j + 1].x) / 2;
        const yc = (ptsTop[j].y + ptsTop[j + 1].y) / 2;
        ctx.quadraticCurveTo(ptsTop[j].x, ptsTop[j].y, xc, yc);
      }
      ctx.lineTo(ptsTop[ptsTop.length - 1].x, ptsTop[ptsTop.length - 1].y);
      
      // Return along bottom edge
      for (let j = ptsBot.length - 1; j > 0; j--) {
        const xc = (ptsBot[j].x + ptsBot[j - 1].x) / 2;
        const yc = (ptsBot[j].y + ptsBot[j - 1].y) / 2;
        ctx.quadraticCurveTo(ptsBot[j].x, ptsBot[j].y, xc, yc);
      }
      ctx.closePath();

      // Satin gradient fill
      const grad = ctx.createLinearGradient(0, centerY - amp, 0, centerY + amp);
      grad.addColorStop(0, strokeColors[li]);
      grad.addColorStop(0.5, fillGradients[li]);
      grad.addColorStop(1, strokeColors[li]);
      ctx.fillStyle = grad;
      ctx.fill();

      // Delicate silk rim stroke
      ctx.lineWidth = 1.4;
      ctx.strokeStyle = strokeColors[li];
      ctx.stroke();
    }
    ctx.restore();

    // Center guide line
    ctx.strokeStyle = 'rgba(255,255,255,0.85)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(0, centerY);
    ctx.lineTo(cssW, centerY);
    ctx.stroke();

    // Pearl Playhead with 1-pulse-every-10s breath when paused
    const isPaused = (state && state.transport !== 'playing');
    let breathScale = 1.0;
    let breathAlpha = 1.0;
    if (isPaused) {
      // 1 cycle every ~10s (period = 10,000 ms)
      // Smooth sinusoidal oscillation between 0.30 and 1.50
      const cycle = Math.sin(nowMs * (2 * Math.PI / 10000));
      breathScale = 0.90 + 0.60 * cycle; // 0.30 to 1.50
      breathAlpha = 0.65 + 0.35 * cycle; // tonality variation
    }

    const px = (!indeterminate) ? (progressPct / 100) * cssW : cssW / 2;
    const outerR = 10 * breathScale;
    const innerR = 5 * breathScale;

    // Outer pearl glow
    const grad = ctx.createRadialGradient(px, centerY, 2 * breathScale, px, centerY, outerR);
    grad.addColorStop(0, 'rgba(255,255,255,' + (0.95 * breathAlpha) + ')');
    grad.addColorStop(0.5, 'rgba(255,255,255,' + (0.60 * breathAlpha) + ')');
    grad.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(px, centerY, outerR, 0, Math.PI * 2);
    ctx.fill();

    // Inner pearl sphere
    ctx.fillStyle = 'rgba(255,255,255,' + breathAlpha + ')';
    ctx.beginPath();
    ctx.arc(px, centerY, innerR, 0, Math.PI * 2);
    ctx.fill();
    if (reduced) {
      canvas._frozenSnapshotDrawn = true;
    }
  }

  function scheduleWaveformDraw(progressPct, indeterminate) {
    const now = performance.now ? performance.now() : Date.now();
    // 30 fps gate via 33.33 ms
    if (lastWaveformFrame && (now - lastWaveformFrame) < WAVEFORM_FRAME_INTERVAL - 0.001) {
      return;
    }
    lastWaveformFrame = now;
    drawWaveform(progressPct, indeterminate);
  }

  function requestWaveformDraw(progressPct, indeterminate) {
    if (document.hidden || !waveformVisible) return;
    const now = performance.now ? performance.now() : Date.now();
    if (lastWaveformFrame && (now - lastWaveformFrame) < WAVEFORM_FRAME_INTERVAL - 0.001) {
      // Still respect gate
    }
    if (waveformRafId !== null) return;
    waveformRafId = requestAnimationFrame(() => {
      waveformRafId = null;
      scheduleWaveformDraw(progressPct, indeterminate);
    });
  }
  // Subtle idle breathing animation loop (Siri-like organic vibration)
  let idleRafId = null;
  function idleBreathingLoop() {
    if (!document.hidden && waveformVisible && !(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches)) {
      const pct = (state && state.progress && state.progress.kind === 'determinate' && state.progress.total_units > 0) ? Math.min(100, (state.progress.consumed_units / state.progress.total_units) * 100) : 0;
      drawWaveform(pct, state && state.progress && state.progress.kind === 'indeterminate');
    }
    idleRafId = requestAnimationFrame(idleBreathingLoop);
  }
  if (typeof requestAnimationFrame === 'function') {
    idleRafId = requestAnimationFrame(idleBreathingLoop);
  } else if (typeof drawWaveform === 'function') {
    drawWaveform(0, false);
  }
  // visibilitychange pause - pause when hidden, resume with one fresh frame
  document.addEventListener('visibilitychange', () => {
    waveformVisible = !document.hidden;
    if (document.hidden) {
      if (waveformRafId !== null) {
        if (typeof cancelAnimationFrame === 'function') {
          cancelAnimationFrame(waveformRafId);
        }
        waveformRafId = null;
      }
      return;
    }
    // Resume with one fresh frame
    if (state && state.progress) {
      const pct = state.progress.kind === 'indeterminate' ? 0 : (state.progress.total_units > 0 ? Math.min(100, (state.progress.consumed_units / state.progress.total_units) * 100) : 0);
      lastWaveformFrame = 0; // reset gate to allow immediate frame
      drawWaveform(pct, state.progress.kind === 'indeterminate');
    } else {
      lastWaveformFrame = 0;
      drawWaveform(0, false);
    }
  });
  // reduced-motion dynamic toggle
  if (window.matchMedia) {
    try {
      const mq = window.matchMedia('(prefers-reduced-motion: reduce)');
      const handleRM = () => {
        if (els.waveform) {
          els.waveform._frozenSnapshotDrawn = false;
        }
        if (state && state.progress) {
          const pct = state.progress.kind === 'indeterminate' ? 0 : (state.progress.total_units > 0 ? Math.min(100, (state.progress.consumed_units / state.progress.total_units) * 100) : 0);
          drawWaveform(pct, state.progress.kind === 'indeterminate');
        } else {
          drawWaveform(0, false);
        }
      };
      if (typeof mq.addEventListener === 'function') {
        mq.addEventListener('change', handleRM);
      } else if (typeof mq.addListener === 'function') {
        mq.addListener(handleRM);
      }
    } catch (e) {}
  }

  // reduced-motion: freeze decorative (canvas draws static snapshot on each renderProgress call; no rAF loop)
  function renderProgress() {
    let pct = 0;
    if (state.progress.kind === 'determinate' && state.progress.total_units > 0) {
      pct = Math.min(100, (state.progress.consumed_units / state.progress.total_units) * 100);
    } else if (state.progress.kind === 'indeterminate') {
      els.progressFill.style.width = '0%';
      els.progressFill.style.background = 'linear-gradient(90deg, transparent, var(--sona-voice), transparent)';
      els.progressFill.style.backgroundSize = '200% 100%';
      els.progressFill.style.animation = 'indeterminate 1.5s';
      els.progressLabel.textContent = '';
      els.progress.removeAttribute('aria-valuenow');
      els.progress.setAttribute('aria-valuetext', 'carregando');
      if (els.liveRegion) els.liveRegion.textContent = 'carregando';
      drawWaveform(pct, true);
      return;
    }
    els.progressFill.style.width = `${pct}%`;
    els.progressFill.style.background = 'var(--sona-voice)';
    els.progressFill.style.animation = 'none';
    els.progressLabel.textContent = state.progressLabel || '';
    els.progress.setAttribute('aria-valuenow', String(Math.round(pct)));
    els.progress.setAttribute('aria-valuetext', state.progressLabel || `progresso ${Math.round(pct)} por cento`);
    if (els.liveRegion && (Math.abs(pct - (els._lastPct||0)) >= 5 || els._lastPct === undefined)) {
      els.liveRegion.textContent = state.progressLabel || `progresso ${Math.round(pct)} por cento`;
      els._lastPct = pct;
    }
    drawWaveform(pct, false);
  }

  function renderSpeed() {
    // FR-012: rate-value blind — the numeric rung MUST NOT
    // appear on any surface. The stepper orients by position
    // on the closed 7-rung ladder (dots), earcon and haptic.
    if (els.speedDots.childElementCount !== LADDER.length) {
      els.speedDots.innerHTML = '';
      for (let i = 0; i < LADDER.length; i++) {
        const dot = document.createElement('span');
        dot.className = 'speed-dot';
        els.speedDots.appendChild(dot);
      }
    }
    const dots = els.speedDots.children;
    for (let i = 0; i < dots.length; i++) {
      dots[i].classList.toggle('active', i === rateIndex);
    }
    if (els.rateValue) els.rateValue.textContent = `${LADDER[rateIndex]}×`;
  }

  function renderReason() {
    if (state.reason) {
      els.reasonBanner.textContent = state.reason;
      els.reasonBanner.className = 'reason-banner visible ' + (state.reasonExpiry === 'focus_3s' ? 'warning' : 'failure');
      // Auto-hide for focus_3s expiry
      if (state.reasonExpiry === 'focus_3s') {
        setTimeout(() => {
          if (state.reasonExpiry === 'focus_3s') { // still same expiry
            state.reason = null;
            state.reasonExpiry = null;
            renderReason();
          }
        }, 3000);
      }
    } else {
      els.reasonBanner.className = 'reason-banner';
      els.reasonBanner.textContent = '';
    }
  }

  function renderAll() {
    renderDocumentTitle();
    renderTransport();
    renderSectionTitle();
    renderProgress();
    renderSpeed();
    renderReason();
  }

  // FR-009 — the resume offer, read from the shape published by
  // the shell: the route key `offer_route` and the window the
  // shell published with it (`window_ms` in the reply of the route
  // command, `offer_window_ms` on the cold-start open payload). The
  // shape is read as published; the surface never re-derives the
  // route and never invents a window.
  //
  // The shell publishes the PENDING COLD-START fact with it
  // (`pending_cold_start`): a deliberate-pause reopen parks the
  // cold start behind its open offer, and that parked open is the
  // only thing that tells the reopen from a pause inside a running
  // document — the mirrored state reads the same for both, so the
  // route alone cannot separate them (FR-009).
  function offerShapeOf(payload) {
    if (!payload) {
      return null;
    }
    const route = payload.offer_route || null;
    const windowMs = payload.window_ms ?? payload.offer_window_ms ?? null;
    const pendingColdStart = payload.pending_cold_start || false;
    return { route, windowMs, pendingColdStart };
  }

  // The context of the offer: the title, the section title and the
  // progress already on screen — and nothing else (FR-011/FR-019):
  // no document prose, no rate value, no voice identity, no
  // elapsed or remaining time.
  function renderOffer() {
    els.offerTitle.textContent = state.title || '';
    els.offerSection.textContent = state.sectionTitle || '';
    els.offerProgress.textContent = state.progressLabel || '';
  }

  // Opens the offer dialog for the in-app route, with the window
  // the shell published. Any other route — the lock-screen route
  // and the no-route case — opens NO in-app dialog.
  function openOffer(windowMs) {
    if (els.offerDialog.open) {
      return;
    }
    renderOffer();
    els.offerDialog.showModal();
    offer.route = 'in_app_dialog';
    offer.windowMs = windowMs;
    offer.shown = true;
    // The elapsing of the window is the rule of the SHELL: the
    // surface only closes the dialog — the silence rule (continue
    // from the stored position) is a decision of the shell.
    offer.timer = setTimeout(closeOffer, windowMs);
  }

  // Closes the offer dialog. The offer episode ends here: the
  // dialog does not reopen for the same route, and a later route
  // opens it again.
  function closeOffer() {
    if (offer.timer !== null) {
      clearTimeout(offer.timer);
      offer.timer = null;
    }
    offer.route = null;
    offer.windowMs = null;
    if (els.offerDialog.open) {
      els.offerDialog.close();
    }
  }

  // Branches on the route the shell published: the in-app route
  // opens the dialog, every other route closes it.
  function applyOffer(route, windowMs, pendingColdStart) {
    if (route !== 'in_app_dialog') {
      // The route left the in-app one: a later offer may open the
      // dialog again.
      offer.shown = false;
      closeOffer();
      return;
    }
    // The offer belongs to a REOPEN (FR-009: "when reopening a
    // deliberately paused document"), and the shell publishes the
    // parked cold start that IS the reopen. The mirrored state
    // cannot tell the two apart — a cold-start reopen and a pause
    // inside a running document read the same there — so the
    // dialog opens ONLY for the published fact, never for the
    // mirror.
    if (!pendingColdStart) {
      offer.shown = false;
      closeOffer();
      return;
    }
    if (offer.shown) {
      return; // this offer episode is already on screen
    }
    if (typeof windowMs !== 'number' || !(windowMs > 0)) {
      // The shell published no window: the surface never invents
      // a bound of its own (FR-032c).
      closeOffer();
      return;
    }
    openOffer(windowMs);
  }

  // Reads the offer route published by the shell. The route command
  // is the window of the surface on the offer: the cold start opens
  // the document behind the offer, and the route published by the
  // shell is what it says about that offer.
  async function refreshOffer() {
    if (offerPollBusy) {
      return;
    }
    // A reading in progress holds no open offer — the offer is a
    // cold-start event — so the poll skips the round trip.
    if (state.transport === 'playing' && !els.offerDialog.open) {
      return;
    }
    offerPollBusy = true;
    try {
      const reply = await invoke('offer_route');
      const shape = offerShapeOf(reply);
      if (shape === null) {
        return;
      }
      applyOffer(shape.route, shape.windowMs, shape.pendingColdStart);
    } catch (e) {
      // The route is unreadable: no offer is shown, and the next
      // poll asks again.
    } finally {
      offerPollBusy = false;
    }
  }

  // Tauri invoke wrapper
  async function invoke(cmd, args = {}) {
    try {
      const invoker = window.__TAURI__?.invoke || window.__TAURI_INTERNALS__?.invoke;
      if (typeof invoker === 'function') {
        return await invoker(cmd, args);
      }
      throw new Error('Tauri invoke function not available');
    } catch (e) {
      console.error(`Invoke ${cmd} failed:`, e);
      throw e;
    }
  }

  // Action handlers
  async function sendAction(action) {
    const payload = { action };
    if (fingerprint) payload.fingerprint = fingerprint;
    try {
      await invoke('run_mobile_plugin', payload);
    } catch (e) {
      console.error(`Action ${action} failed:`, e);
    }
  }

  // Button event listeners
  //
  // FR-019 / FR-001: the play control RESUMES the reading the app
  // already holds, at the place it stopped — the resume-at-stored
  // wire. The bare synthesis wire is never sent from this screen:
  // the screen holds no document, and the verb channel carries
  // none, so a synthesis wire would reach the synthesis entry
  // empty and be refused (the control would never start or resume
  // a reading at all). The pause arm is the toggle's other half.
  els.btnPlayPause.addEventListener('click', () => {
    sendAction(state.transport === 'playing' ? 'pause' : 'resume_at_stored');
  });

  els.btnStop.addEventListener('click', async () => {
    await sendAction('stop');
    // Stop clears stored position - also call session delete if we have fingerprint
    if (fingerprint) {
      try {
        await invoke('session_delete', { fingerprint });
      } catch (e) {
        console.warn('session_delete failed:', e);
      }
    }
  });

  els.btnSkipBack.addEventListener('click', () => sendAction('skip_back5s'));
  els.btnSkipForward.addEventListener('click', () => sendAction('skip_forward5s'));
  els.btnRepeat.addEventListener('click', () => {
    // Section restart - reuse SkipBack earcon behavior
    sendAction('repeat_section');
  });

  els.btnRateDown.addEventListener('click', () => {
    if (rateIndex > 0) {
      rateIndex--;
      state.rate = LADDER[rateIndex];
      sendAction('rate_down');
      renderSpeed();
    }
  });

    const speedPill = document.getElementById('speedPill');
  if (speedPill) {
    speedPill.addEventListener('click', () => {
      rateIndex = (rateIndex + 1) % LADDER.length;
      state.rate = LADDER[rateIndex];
      sendAction(rateIndex === 0 ? 'rate_down' : 'rate_up');
      renderSpeed();
    });
  }

  els.btnRateUp.addEventListener('click', () => {
    if (rateIndex < LADDER.length - 1) {
      rateIndex++;
      state.rate = LADDER[rateIndex];
      sendAction('rate_up');
      renderSpeed();
    }
  });

  // FR-009: the two closed offer choices — continue from the
  // stored position, or start over from the first spoken
  // position. Both dispatch the wire verbs of the shell through
  // the same `sendAction` path the transport controls use; the
  // offer has no third choice.
  els.btnOfferContinue.addEventListener('click', async () => {
    closeOffer();
    await sendAction('resume_at_stored');
  });

  els.btnOfferStartOver.addEventListener('click', async () => {
    closeOffer();
    await sendAction('start_over');
  });

  // T167: Document picker trigger via Title Card
  let pickerDebounceTimer = null;
  function triggerDocumentPicker() {
    if (pickerDebounceTimer) {
      return;
    }
    pickerDebounceTimer = setTimeout(() => {
      pickerDebounceTimer = null;
    }, 500);

    sendAction('pick_document').then(() => {
      if (els.titleCard) {
        els.titleCard.focus();
      }
    }).catch((err) => {
      console.error('Failed to launch document picker:', err);
      if (els.titleCard) {
        els.titleCard.focus();
      }
    });
  }

  if (els.titleCard) {
    els.titleCard.addEventListener('click', () => {
      triggerDocumentPicker();
    });

    els.titleCard.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        triggerDocumentPicker();
      }
    });
  }

  // Register for mirror publish channel
  async function registerPublishListener() {
    try {
      await invoke('register_publish_listener');
      console.log('Publish listener registered');
    } catch (e) {
      console.error('Failed to register publish listener:', e);
    }
  }

  // Listen for mirror updates from Rust
  if (window.__TAURI__) {
    window.__TAURI__.event.listen('tauri://channel/mirror-publish', (event) => {
      const mirror = event.payload;
      if (!mirror) return;

      state.transport = mirror.transport;
      state.positionSecs = mirror.position_secs;
      state.progress = mirror.progress;
      state.progressLabel = mirror.progress_label || null;
      state.sectionTitle = mirror.section_title || null;

      // Update rate index from current rate if it changed
      const rateIdx = LADDER.findIndex(r => Math.abs(r - state.rate) < 0.01);
      if (rateIdx >= 0) rateIndex = rateIdx;

      // A torn-down session ends the offer episode: the document
      // the offer belonged to is gone (an explicit stop, a document
      // switch), so a later offer opens the dialog again.
      if (state.transport === 'stopped') {
        offer.shown = false;
      }

      renderAll();
      refreshOffer();
    });
  }

  // Initialize
  async function init() {
    // Try to get initial status view
    try {
      const initial = await invoke('get_status_view');
      if (initial) {
        state.title = initial.title || state.title;
        state.sectionTitle = initial.section_title || null;
        state.rate = initial.rate;
        state.transport = initial.transport;
        state.positionSecs = initial.position_secs;
        state.reason = initial.reason;
        state.reasonExpiry = initial.reason_expiry;
        rateIndex = LADDER.findIndex(r => Math.abs(r - state.rate) < 0.01);
        if (rateIndex < 0) rateIndex = 1;
        // The cold-start open payload carries the route of the
        // offer and the window with it — the same shape the route
        // command publishes.
        const shape = offerShapeOf(initial);
        if (shape !== null) {
          applyOffer(shape.route, shape.windowMs, shape.pendingColdStart);
        }
      }
    } catch (e) {
      console.log('No initial status view, using defaults');
    }

    await registerPublishListener();
    // Register RMS channel for waveform (T102)
    try {
      if (typeof invoke === 'function') {
        await invoke('register_rms_listener');
      }
    } catch (e) {
      console.warn('rms listener registration failed', e);
    }
    // Notify visibility changes for RMS throttling
    const reportVisibility = () => {
      try {
        if (typeof invoke === 'function') {
          invoke('set_rms_visibility', { hidden: document.hidden });
        }
      } catch (e) {}
    };
    reportVisibility();
    document.addEventListener('visibilitychange', reportVisibility);
    if (window.__TAURI__ && window.__TAURI__.event) {
      window.__TAURI__.event.listen('tauri://channel/rms', (event) => {
        const payload = event.payload;
        window.__RMS__ = payload;
        if (typeof payload === 'number') {
          pushRms(payload);
        } else if (payload && typeof payload.rms === 'number') {
          pushRms(payload.rms);
        } else if (payload && typeof payload.value === 'number') {
          pushRms(payload.value);
        }
        if (state && state.progress) {
          const pct = state.progress.kind === 'indeterminate' ? 0 : (state.progress.total_units > 0 ? Math.min(100, (state.progress.consumed_units / state.progress.total_units) * 100) : 0);
          requestWaveformDraw(pct, state.progress.kind === 'indeterminate');
        }
      });
    }
    renderAll();
    // The route of the offer is polled on the cadence of the
    // shell: the cold start opens the document behind the offer,
    // and the route published by the shell is what decides whether
    // the in-app dialog opens.
    setInterval(refreshOffer, OFFER_POLL_MS);
    refreshOffer();
  }

  // Add indeterminate animation keyframes
  const style = document.createElement('style');
  style.textContent = `
    @keyframes indeterminate {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }
  `;
  document.head.appendChild(style);

  init();
  drawWaveform(0, true);
</script>
</body>
</html>
