<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ressoa — Playback Shell</title>
<style>
  body { font-family: system-ui, sans-serif; background: #111827; color: #f3f4f6; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
  .card { background: #1f2937; padding: 2rem; border-radius: 1rem; max-width: 420px; width: 90%; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
  h1 { font-size: 1.5rem; margin-bottom: 0.5rem; }
  h2 { font-size: 1rem; color: #9ca3af; margin: 0 0 1rem; }
  .controls button { font-size: 1.2rem; padding: 0.75rem 1.5rem; margin: 0.25rem; border: none; border-radius: 0.5rem; background: #2563eb; color: white; cursor: pointer; }
  .status { margin-top: 1rem; font-family: ui-monospace, monospace; font-size: 0.85rem; color: #d1d5db; }
</style>
</head>
<body>
<div class="card">
  <h1>Ressoa</h1>
  <h2 id="section">Seção: —</h2>
  <div class="controls">
    <button onclick="postPlay()">▶ Play</button>
    <button onclick="postPause()">⏸ Pause</button>
    <button onclick="postStop()">⏹ Stop</button>
    <button onclick="postSkipFwd()">⏩ +5s</button>
    <button onclick="postSkipBack()">⏪ -5s</button>
  </div>
  <div class="status" id="status">Status: Pronto — pressione Play</div>
  <div class="status" id="position">Posição: 0.0 s</div>
</div>
<script>
  function postPlay()  { document.getElementById('status').textContent = 'Status: Playing'; }
  function postPause() { document.getElementById('status').textContent = 'Status: Paused'; }
  function postStop()  { document.getElementById('status').textContent = 'Status: Stopped'; document.getElementById('position').textContent = 'Posição: 0.0 s'; }
  function postSkipFwd() { const p = parseFloat(document.getElementById('position').textContent.replace(/[^0-9.]/g,'')); document.getElementById('position').textContent = 'Posição: ' + (p+5.0).toFixed(1) + ' s'; }
  function postSkipBack() { const p = parseFloat(document.getElementById('position').textContent.replace(/[^0-9.]/g,'')); document.getElementById('position').textContent = 'Posição: ' + Math.max(0, p-5.0).toFixed(1) + ' s'; }
</script>
</body>
</html>
